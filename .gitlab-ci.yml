variables:
  PYTHON_BIN: "python3"
  PYTHONPATH: "."

default:
  tags:
    - shell
    - Debian
  before_script:
    - sudo apt-get update -y || true
    - sudo apt-get install -y xvfb python3-gi python3-gi-cairo gir1.2-gtk-3.0 2>/dev/null || true
    - python3 -m venv --system-site-packages .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -e ".[dev,ai]"

stages:
  - lint
  - build
  - docs
  - test

# 1. Style : PEP8 via flake8
coding-style:
  stage: lint
  script:
    - flake8 othello/ --exclude=pdp/ --count --max-line-length=79 --statistics
    - flake8 tests/ --exclude=pdp/ --count --max-line-length=79 --statistics

# 2. Build : Installation du projet
compilation:
  stage: build
  script:
    - $PYTHON_BIN -m compileall othello/

# 3. Documentation : Sphinx
documentation:
  stage: docs
  script:
    - pip install .
    - cd docs && make html
  artifacts:
    paths:
      - docs/_build/html

# 4. Tests unitaires (tous les tests, GUI inclus avec xvfb)
unit-tests:
  stage: test
  script:
    - |
      cat > .coveragerc << 'EOF'
      [report]
      fail_under = 85
      EOF
    # Lancement de TOUS les tests sous xvfb pour éviter le core dumped
    - xvfb-run --auto-servernum python3 -m pytest tests/ --cov=othello/ --cov-report=term-missing
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
