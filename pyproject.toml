[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "othello"
version = "0.1.0"
description = "A strategic Othello game with CLI and GUI, featuring AI and network play."

authors = [
  { name = "Gregory Bonzon"},
  { name = "Remi Boussion"},
  { name = "Gabriel Ringuet"},
  { name = "Matthieu Vigier-Lafosse"},
  { name = "Arthur Voisin"}
]
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]
readme = "README.md"

requires-python = ">=3.10"

dependencies = [
    'importlib-metadata; python_version<="3.10"',
    "pytest>=7.0",
    "pytest-cov",
    "coverage>=6.0",
    "sphinx>=5.0",
    "sphinx_rtd_theme",
    "black",
    "flake8",
    "hacking",
    "pylint",
    "PyGObject>=3.42.0",
    "tensorflow>=2.10.0",
    "keras>=2.10.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.7.2",
    "pandas",
    "statsmodels",
    "matplotlib>=3.7.0"
]

[project.scripts]
othello = "othello.__main__:main"

[tool.black]
line-length = 79
# E203 : Black met des espaces avant les ':', Flake8 n'aime pas ça. Il faut l'ignorer.
extend-ignore = ["E203"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = [ # Add options for pytest
  "--cov=othello",
  "--cov-report=html",
  "--cov-report=term",
  "--cov-branch",
  "--cov-fail-under=85",
]

[tool.coverage.run]
omit = ["*/__main__.py"] # ignorer __main__.py pour les test (++coverage)
source = ["othello"] 
relative_files = true

[tool.setuptools.packages.find]
include = ["othello*"]